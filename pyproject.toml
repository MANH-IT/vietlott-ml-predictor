[project]
name = "vietlott-ml"
version = "1.0.0"
description = "Pipeline học máy thực hành trên dữ liệu xổ số Vietlott (chỉ phục vụ học tập)."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "requests>=2.32",
    "joblib>=1.4",
    "vietlott-data>=0.3.0",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".git", ".venv", "venv", "__pycache__", "data", "models", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
